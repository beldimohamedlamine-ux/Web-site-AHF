# AHF CONSULTING — extrait à inclure dans un bloc server { } (Nginx)
# Exemple : include /chemin/vers/nginx-security-snippet.conf;
#
# Décommenter add_header Strict-Transport-Security uniquement sur le vhost HTTPS
# et après vérification que tout le site est en HTTPS.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formsubmit.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://formsubmit.co; upgrade-insecure-requests" always;

# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Recommandé : ne pas afficher la version de Nginx
# server_tokens off;
